                    <button type="button" id="changtocategoryBTN">Add category</button>

                <div class="headeraddcard">

                </div>
                <div id="adminCat">

                </div>
                <div id="adminimg">

                </div>
                <div class="showimage" id="showing">

                </div>
                <div id="adminDescrip">

                </div>
                <div id="adminPrice">

                </div>
                <div class="btnsaddcard">

                    <button type="button" id="closeAdminCard">close ❌</button>
                </div>

                </div>
                <div id="categoryName">
                    <input type="text" placeholder="Example: Electrical tools" id="categoryNameInput">
                    <label for="categoryNameInput">Category name</label>
                </div>
                <div id="categoryemojy">
                    <input type="text" placeholder="Example: glasses = 😎" id="categoryemojyInput">
                    <label for="categoryemojyInput">Category emojy</label>
                </div>
                <div id="showCategory">
                </div>
                <div class="btnscat">

                    <button type="button" id="closeAdminCat">close</button>
